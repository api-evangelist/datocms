aid: datocms
name: DatoCMS
description: >-
  DatoCMS is a headless content management system that enables users to create, manage, and deliver digital content
  across websites, mobile apps, and other digital experiences. The platform exposes a JSON:API-based Content Management
  API for content and schema, and a CDN-fronted GraphQL Content Delivery API for read-heavy client applications.
